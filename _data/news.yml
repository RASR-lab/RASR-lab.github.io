- headline: RASR lab at the Blugold Biomedical Exploration Camp
  post: The RASR Lab participated in the Blugold Biomedical Exploration Camp, which brought high school students from across the United States to explore biomedical engineering and its applications. Dr. Bhat led a hands-on project in which students built a simple elbow exoskeleton controlled using electromyography (EMG) signals from the biceps muscle
  date: July 27th, 2026
